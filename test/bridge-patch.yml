# dsh-qq-bridge 本地测试补丁（--patch 注入，配合 DSH_HOME=/tmp/dsh-qq-test 隔离实例）
- insert:
    - id: qq-bridge
      name: '@dsh-qq/qq-bridge'
      config:
        onebotWs: 'ws://127.0.0.1:6710'
        onebotToken: ''
        sessionCwd: '/tmp/dsh-qq-test/work'
        ack: true
        stallNoticeMs: 60000
        forceFlushMs: 30000
        autoAnswer: 'reject'
        maxChunkLength: 3500
